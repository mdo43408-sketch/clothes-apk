name: Build OneSystem Clothing ERP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q OneSystemClothingERP_Pro_Final_SingleDevice.zip -d project

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find project -name "settings.gradle*" -o -name "build.gradle*"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      -       - name: Build APK
        run: |
          ROOT=$(dirname "$(find project -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -1)")
          echo "Gradle root: $ROOT"
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneSystem-Clothing-ERP-Pro
          path: project/**/build/outputs/apk/debug/*.apk
